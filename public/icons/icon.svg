<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo Terracotta y Lino cálido -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b86b28" />
      <stop offset="50%" stop-color="#a86224" />
      <stop offset="100%" stop-color="#8e511c" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fondo Cuadrado con bordes redondeados elegantes (Seguro para Maskable) -->
  <rect width="512" height="512" rx="108" fill="url(#bgGradient)" />

  <!-- Borde interior sutil -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="4" />

  <!-- Círculo interior de brillo -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" fill-opacity="0.04" />

  <!-- Grupo central: Gorro de Chef Profesional + Destellos Culinarios -->
  <g filter="url(#softShadow)">
    <!-- Base / Banda del Gorro de Chef -->
    <rect x="156" y="324" width="200" height="48" rx="12" fill="#faf7f2" />
    <!-- Pliegues verticales de la banda -->
    <line x1="206" y1="334" x2="206" y2="362" stroke="#e7dfd5" stroke-width="4" stroke-linecap="round" />
    <line x1="256" y1="334" x2="256" y2="362" stroke="#e7dfd5" stroke-width="4" stroke-linecap="round" />
    <line x1="306" y1="334" x2="306" y2="362" stroke="#e7dfd5" stroke-width="4" stroke-linecap="round" />

    <!-- Cúpula central del Gorro -->
    <circle cx="256" cy="224" r="82" fill="#ffffff" />
    <!-- Cúpula izquierda -->
    <circle cx="188" cy="252" r="62" fill="#ffffff" />
    <!-- Cúpula derecha -->
    <circle cx="324" cy="252" r="62" fill="#ffffff" />

    <!-- Cuerpo inferior de unión hacia la banda -->
    <path d="M 166 270 Q 156 324 166 324 L 346 324 Q 356 324 346 270 Z" fill="#ffffff" />
  </g>

  <!-- Destello de Innovación e IA Culinaria (Estrella superior derecha) -->
  <g transform="translate(356, 128) scale(1.1)" filter="url(#subtleGlow)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24 Z" fill="url(#goldGradient)" />
  </g>

  <!-- Destello secundario pequeño (Izquierda) -->
  <g transform="translate(132, 172) scale(0.65)" filter="url(#subtleGlow)">
    <path d="M 0 -20 Q 0 0 20 0 Q 0 0 0 20 Q 0 0 -20 0 Q 0 0 0 -20 Z" fill="url(#goldGradient)" />
  </g>
</svg>
